# Builds, smoke-tests and pushes the image before tagging, so a failed build
# leaves no tag or release behind.
name: Release
run-name: Release ${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Frigate version and build number, e.g. 0.18.2-1
        required: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      frigate: ${{ steps.check.outputs.frigate }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the version
        id: check
        env:
          VERSION: ${{ inputs.version }}
        run: |
          source upstream.env
          frigate=${FRIGATE_TAG#v}
          if [[ ! $VERSION =~ ^${frigate//./\\.}-[0-9]+$ ]]; then
            echo "'$VERSION' is not $frigate-<build number>, e.g. $frigate-1" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "tag v$VERSION already exists" >&2
            exit 1
          fi
          echo "frigate=$frigate" >> "$GITHUB_OUTPUT"

  image:
    needs: validate
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      version: ${{ inputs.version }}
      tags: ${{ inputs.version }} ${{ needs.validate.outputs.frigate }} latest

  release:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create the tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          source upstream.env
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          previous=$(git describe --tags --abbrev=0 2>/dev/null || true)
          {
            echo "Frigate $FRIGATE_TAG (\`$FRIGATE_COMMIT\`) with the Panther Lake Intel stack."
            echo
            echo '```'
            echo "docker pull $image:$VERSION"
            echo '```'
            echo
            echo "## Changes${previous:+ since $previous}"
            echo
            git log --format='- %s' ${previous:+$previous..}HEAD
          } > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
