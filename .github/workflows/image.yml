name: Image
on:
  workflow_call:
    inputs:
      version:
        description: Version Frigate reports; empty for the build.sh default
        type: string
        default: ""
      tags:
        description: Space-separated image tags; a sha-<commit> tag is always added
        type: string
        required: true

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # The runner starts with ~14 GB free and a cold build needs ~24 GB
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune --all --force
          df -h /

      - name: Image tags
        id: tags
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          refs=""
          for tag in $TAGS "sha-${GITHUB_SHA::7}"; do
            refs+="$image:${tag//\//-} "
          done
          echo "refs=${refs% }" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VERSION: ${{ inputs.version }}
          REFS: ${{ steps.tags.outputs.refs }}
        run: |
          args=(--label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY")
          for ref in $REFS; do
            args+=(--tag "$ref")
          done
          if [[ -n $VERSION ]]; then
            args+=(--version "$VERSION")
          fi
          ./build.sh "${args[@]}"

      # The runner has no Intel GPU or NPU: this proves the userspace is installed
      # and loads, not that it drives the hardware
      - name: Smoke test
        env:
          REFS: ${{ steps.tags.outputs.refs }}
        run: docker run --rm --entrypoint verify-frigate-intel "${REFS%% *}" --static

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        env:
          REFS: ${{ steps.tags.outputs.refs }}
        run: |
          for ref in $REFS; do
            docker push "$ref"
          done
